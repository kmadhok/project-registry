[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-registry"
version = "0.1.0"
description = "Private project portfolio registry and GitHub intelligence dashboard"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
project-registry = "project_registry.cli:main"

[tool.setuptools.packages.find]
include = ["project_registry*"]

[tool.unittest]
start-directory = "tests"
