id: ai-engineering-markets
name: ai_engineering_markets
purpose: 'Analysis of the areas of AI an individual can invest in: where the profit goes,
  how to get exposure, and how the areas compare, kept current.'
desired_outcome: A sourced, ranked, regularly refreshed analysis of AI investment areas that
  Kanu can read and act on himself.
brief:
  done_criteria:
  - '["research/ai-investing/MAP.md covers the investable areas of AI (at minimum chips and
    accelerators'
  - memory
  - networking
  - power and energy
  - data centers
  - cloud
  - models
  - applications
  - security
  - robotics)
  - and for each one says who captures the profit
  - how an individual can get exposure
  - the main risks and what would change the view"
  - '"each area has its own dated memo in research/ai-investing/ in which every factual claim
    has a source and an A/B/C evidence tier'
  - with valuation and financial figures dated"
  - '"research/ai-investing/RANKING.md compares the areas on stated criteria'
  - with assumptions visible and numbers reproducible by a script in the repo"
  - '"every memo records the strongest case against its thesis and what evidence would prove
    it wrong"'
  - '"memos older than 30 days are refreshed'
  - with what changed since the last version recorded at the top"]
  non_goals:
  - '["no placing orders'
  - no connecting a brokerage or exchange account
  - no moving money"
  - '"no further work on the Kalshi instrumentation'
  - which stays in the repo as finished background"
  - '"no paid data sources without Kanu''s approval"]'
  constraints:
  - '["prefer primary sources (filings'
  - earnings
  - company and government data) and label anything weaker with its tier"
  - '"state uncertainty and base rates plainly; no price targets without the reasoning and
    data behind them"'
  - '"new Python dependencies are pinned"]'
  open_decisions:
  - question: Allow-list the `dependencies` change class in automation.allow for ai-engineering-markets?
      This unblocks 5 of 7 remaining SPEC items (chunk 1b DuckDB persistence, decision log,
      markout instrumentation, calibration reporting, fee-coverage), all within the brief's
      'stdlib-plus-DuckDB, pin every new dependency' constraint. Chunk 2b (LLM-backed classification)
      additionally needs network.allowed:true and an API key.
    status: answered
    answer: Yes. automation.allow=[dependencies] applied 2026-08-27 (proposal ai-engineering-markets-20260827005139).
      Pin every new dependency in the manifest. Chunk 2b stays blocked until network/API-key
      access is decided separately.
  - question: How should the current (post-Feb-2026) Kalshi fee-schedule PDF be sourced? Automated
      fetch is 429-blocked and the contract sets network.allowed:false.
    status: answered
    answer: 'Owner fetched it 2026-08-28 through a residential browser session: https://kalshi.com/docs/kalshi-fee-schedule.pdf,
      ''Fee Schedule for July 2026 - 7.7.26 Update'', 12 pages. Filed as research/data/kalshi-fee-schedule-2026-08-28-live.pdf
      next to the 2026-02-05 Wayback copy. Use it as the [A] fee_coverage source; do not attempt
      live fetches from the builder. If a future refresh is needed and the live fetch fails
      again, fall back to the newest file in research/data/.'
  - question: 'Criterion 4''s last open item is chunk 2b (LLM-backed FLAG-and-SPLIT classify_resolution).
      Choose one. (A) Build 2b: name the LLM client library and pinned version the builder
      may add; confirm the owner supplies an API key out of band (env var name?) with contract
      network.allowed:true; tests that need the live provider are skipped when no key is set,
      and offline tests use recorded responses; give the minimum agreement rate against the
      110 verified labels that counts as acceptance (e.g. >=90%). (B) Drop 2b and count criterion
      4 as met by chunk 2a''s re-runnable fixture-loader and 110-event regression harness.
      Answer in one line, e.g. ''A: anthropic==X.Y, ANTHROPIC_API_KEY, skip without key, >=90%''
      or ''B''.'
    status: answered
    answer: 'B. Owner decided 2026-11-03 via inbox triage: drop chunk 2b. Criterion 4 counts
      as met by chunk 2a''s re-runnable fixture loader and 110-event regression harness. classify_resolution()
      stays a NotImplementedError stub, so there is no LLM classifier and no API spend. Update
      docs/SPEC.md to record 2b as dropped, not blocked. Reopen only if the owner starts logging
      real decisions and asks for it.'
  reviewed: '2026-11-03'
