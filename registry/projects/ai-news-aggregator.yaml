id: ai-news-aggregator
name: AI-News-Aggregator
purpose: Collect YouTube captions, Semantic Scholar papers, and podcast transcripts into Markdown,
  then organize and semantically search the resulting personal AI knowledge base.
desired_outcome: 'Every collected item is searchable: indexing keeps pace with collection
  automatically, and one CLI command answers questions across YouTube, podcast, and scholar
  sources from a clean checkout.'
brief:
  done_criteria:
  - content_index row count equals collected markdown file count, enforced by a regression
    test
  - a freshly collected file becomes searchable without a manual indexing step
  - python3 -m pytest tests passes from a clean checkout using the pinned manifests
  - 'embeddings and search have tests: ranking sanity, empty query, no match, DB round-trip'
  - re-running a pipeline over already-collected content creates no duplicate rows or files
  non_goals:
  - no new content sources (the X/Twitter pipeline stays specified-but-unbuilt) until the
    existing three are fully indexed and tested
  - no hosted service, API, or web UI - local CLI over local files and SQLite
  - no swap of the embedding model or vector store
  - no republishing or redistribution of collected third-party content
  constraints:
  - content.db is generated data - regenerate it only via the declared generate command and
    commit the refresh deliberately
  - GitHub issue triage and closing is the owner's job; the builder never closes issues
  - whether the X/Twitter pipeline is still wanted is an owner call - treat SPEC_X.md/PLAN_X.md
    consolidation as blocked on it
  reviewed: '2026-08-23'
