descriptions:
  private: This repository has an interative dashboard which explores the Belly Button Biodiversity
    dataset.This dataset catalogs microbes that colonize human navels. The dataset reveals
    that a small handful of microbial species (also called operational taxonomic units, or
    OTUs, in the study) were present in more than 70% of people, while the rest were relatively
    rare.
