id: tradepigskin
name: TradePigskin
purpose: A SwiftUI iOS fantasy-football trade analyzer, co-developed with Mitchel Lister (listmitch),
  that scores multi-player redraft trades from a bundled, manually maintained player-value
  table across PPR, half-PPR and standard formats, applying a consolidation weighting so premium
  players count for more per roster spot.
